[project]
name = "survpfn"
version = "0.1.0"
description = "SurvPFN: In-Context Survival Analysis via Tabular Foundation Models with Retrieval Augmentation"
readme = "README.md"
# Pinned to 3.12 because tabpfn and torchtuples have strict compatibility
# requirements. Change to ">=3.10" only after verifying all deps support it.
requires-python = ">=3.10"
dependencies = [
    # --- core data -------------------------------------------------------
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",           # reading .xlsx files

    # --- survival analysis -----------------------------------------------
    "lifelines>=0.27",          # CoxPH, KM, log-rank
    "pycox>=0.3.0",             # DeepSurv, DeepHit (discrete-time)
    "scikit-survival>=0.22",    # RSF, GBSA, sksurv metrics
    "torchsurv>=0.1.4",         # torchsurv Cox loss (custom_model.py)

    # --- deep learning ---------------------------------------------------
    "torch>=2.0",
    "torchtuples>=0.2.2",       # pycox helper (MLPVanilla, AdamWR)

    # --- ML utilities ----------------------------------------------------
    "scikit-learn>=1.3",
    "scipy>=1.10",              # Wilcoxon test in metrics.py

    # --- hyperparameter optimisation -------------------------------------
    "optuna>=3.0",

    # --- visualisation ---------------------------------------------------
    "matplotlib>=3.7",
    "seaborn>=0.12",

    # --- TabPFN embedding model ------------------------------------------
    "tabpfn>=6.4.1",
    "tabpfn-common-utils[telemetry-interactive]>=0.2.0",
    "omegaconf>=2.3.0",         # config for aware_cox / TabPFNCoxModel

    # --- notebook support ------------------------------------------------
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
# Extra packages for development / testing
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.scripts]
# Run the full evaluation pipeline via CLI
survpfn-train = "scripts.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["survpfn"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
